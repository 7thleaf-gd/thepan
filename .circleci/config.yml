version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:24.8
    resource_class: small

jobs:
  cloudflare-auth:
    executor: node
    environment:
      CLOUDFLARE_ACCOUNT_ID: "85c112de7152c89bb5ea84fdcb397e41"
    steps:
      - run:
          name: Verify account API token
          command: |
            set -euo pipefail
            : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -o /tmp/token.json
            node -e 'const d=require("/tmp/token.json"); if(!d.success || d.result?.status!=="active") process.exit(1)'

  pages-list-access:
    executor: node
    environment:
      CLOUDFLARE_ACCOUNT_ID: "85c112de7152c89bb5ea84fdcb397e41"
    steps:
      - run:
          name: Verify Pages list access
          command: |
            set -euo pipefail
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -o /tmp/pages-list.json
            node -e 'const d=require("/tmp/pages-list.json"); if(!d.success || !Array.isArray(d.result)) process.exit(1)'

  pages-project-access:
    executor: node
    environment:
      CLOUDFLARE_ACCOUNT_ID: "85c112de7152c89bb5ea84fdcb397e41"
      CF_PAGES_PROJECT: "thepan"
    steps:
      - run:
          name: Verify THE PAN Pages project access
          command: |
            set -euo pipefail
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -o /tmp/pages-project.json
            node -e 'const d=require("/tmp/pages-project.json"); if(!d.success || d.result?.name!=="thepan") process.exit(1)'

  deploy-production:
    executor: node
    environment:
      CLOUDFLARE_ACCOUNT_ID: "85c112de7152c89bb5ea84fdcb397e41"
      CF_PAGES_PROJECT: "thepan"
      PUBLISH_DIR: "dist"
    steps:
      - checkout
      - run:
          name: Build
          command: |
            set -euo pipefail
            npm run build
            test -d "$PUBLISH_DIR"
      - run:
          name: Deploy to Cloudflare Pages
          command: |
            set -euo pipefail
            npx --yes wrangler@4.141.0 pages deploy "$PUBLISH_DIR" \
              --project-name="$CF_PAGES_PROJECT" \
              --branch=main \
              --commit-hash="$CIRCLE_SHA1"

  production-readback:
    executor: node
    environment:
      PRODUCTION_URL: "https://thepan.xyz/"
    steps:
      - run:
          name: Production readback
          command: |
            set -euo pipefail
            for i in $(seq 1 30); do
              body="$(curl -fsS --max-time 15 "$PRODUCTION_URL" || true)"
              if printf '%s' "$body" | grep -Fq 'FIVE WAYS IN' &&
                 ! printf '%s' "$body" | grep -Fq 'Music, moving images, SPACE ZINE, browser tools, and the Sapporo context behind THE PAN.'; then
                echo "THEPAN_PRODUCTION_READBACK=PASS"
                exit 0
              fi
              sleep 4
            done
            exit 33

workflows:
  production:
    jobs:
      - cloudflare-auth:
          context: 7thleaf-studios-deploy
          filters:
            branches:
              only: main
      - pages-list-access:
          context: 7thleaf-studios-deploy
          requires:
            - cloudflare-auth
          filters:
            branches:
              only: main
      - pages-project-access:
          context: 7thleaf-studios-deploy
          requires:
            - pages-list-access
          filters:
            branches:
              only: main
      - deploy-production:
          context: 7thleaf-studios-deploy
          requires:
            - pages-project-access
          serial-group: << pipeline.project.slug >>/production
          filters:
            branches:
              only: main
      - production-readback:
          requires:
            - deploy-production
          filters:
            branches:
              only: main
