version: 2.1

jobs:
  deploy-production:
    docker:
      - image: cimg/python:3.13-node
    resource_class: small
    environment:
      CF_PAGES_PROJECT: "thepan"
      PRODUCTION_URL: "https://thepan.xyz/"
      PUBLISH_DIR: "dist"
    steps:
      - checkout
      - run:
          name: Build
          command: |
            set -euo pipefail
            npm run build
            test -d "$PUBLISH_DIR"
      - run:
          name: Deploy through canonical Cloudflare credential broker
          command: |
            set -euo pipefail
            : "${CIRCLE_OIDC_TOKEN_V2:?CircleCI OIDC token required}"
            python -m pip install --user --disable-pip-version-check blake3==1.0.8 >/dev/null
            python scripts/pages-relay-deploy.py "$PUBLISH_DIR"
      - run:
          name: Production readback
          command: |
            set -euo pipefail
            for i in $(seq 1 30); do
              body="$(curl -fsS --max-time 15 "$PRODUCTION_URL" || true)"
              if printf '%s' "$body" | grep -Fq 'FIVE WAYS IN' &&
                 ! printf '%s' "$body" | grep -Fq 'Music, moving images, SPACE ZINE, browser tools, and the Sapporo context behind THE PAN.'; then
                echo "THEPAN_PRODUCTION_READBACK=PASS"
                exit 0
              fi
              sleep 4
            done
            exit 33

workflows:
  production:
    jobs:
      - deploy-production:
          serial-group: << pipeline.project.slug >>/production
          filters:
            branches:
              only: main
