version: 2.1

jobs:
  deploy-pages:
    docker:
      - image: cimg/node:20.19
    resource_class: small
    steps:
      - checkout
      - run:
          name: Build static site
          command: npm run build
      - run:
          name: Publish gh-pages branch
          command: |
            set -euo pipefail
            cd dist
            touch .nojekyll
            git init
            git checkout -b gh-pages
            git config user.name "circleci-pages"
            git config user.email "circleci-pages@users.noreply.github.com"
            git add -A
            git commit -m "deploy: THE PAN pages $CIRCLE_SHA1"
            git remote add origin git@github.com:7thleaf-gd/thepan.git
            git push --force origin gh-pages

workflows:
  pages:
    jobs:
      - deploy-pages:
          filters:
            branches:
              only: main
